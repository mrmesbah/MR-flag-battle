<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Flag Battle Game</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            border-radius: 50%;
        }
        canvas {
            display: block;
            border-radius: 50%;
        }
        #top-banner {
            position: absolute;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 25px;
            border-radius: 30px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
            letter-spacing: 1px;
            text-align: center;
        }
        #settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00f3ff;
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }
        #settings-panel {
            display: none;
            position: fixed;
            bottom: 70px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f3ff;
            padding: 20px;
            border-radius: 12px;
            width: 250px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
        .setting-group {
            margin-bottom: 12px;
        }
        .setting-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #00f3ff;
        }
        .setting-group select, .setting-group input {
            width: 100%;
            padding: 6px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="top-banner">Country Battle Arena</div>
    <div id="game-container"></div>

    <button id="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>

    <div id="settings-panel">
        <div class="setting-group">
            <label>Rotation Speed</label>
            <select id="speed-select" onchange="updateSettings()">
                <option value="0.02">4x</option>
                <option value="0.04" selected>8x</option>
                <option value="0.08">16x</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Number of Flags</label>
            <select id="flags-select" onchange="updateSettings()">
                <option value="10">10 Flags</option>
                <option value="20" selected>20 Flags</option>
                <option value="30">30 Flags</option>
            </select>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Events } = Matter;

        const width = 600;
        const height = 600;

        const engine = Engine.create();
        engine.world.gravity.y = 0.5;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: '#0b0f19'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Arena Circle Boundary Parts with a Gap
        const circleRadius = 250;
        const centerX = width / 2;
        const centerY = height / 2;
        const thickness = 20;
        const segments = 20;
        let boundaryBodies = [];
        let rotatingAngle = 0;
        let rotationSpeed = 0.04;

        function createArena() {
            const angleStep = (Math.PI * 2) / segments;
            // Leave 3 segments open for the gap
            const gapStart = 5;
            const gapEnd = 7;

            for (let i = 0; i < segments; i++) {
                if (i >= gapStart && i <= gapEnd) continue;

                const angle = i * angleStep;
                const x = centerX + Math.cos(angle) * circleRadius;
                const y = centerY + Math.sin(angle) * circleRadius;

                const wall = Bodies.rectangle(x, y, 40, thickness, {
                    isStatic: true,
                    angle: angle + Math.PI / 2,
                    render: { fillStyle: '#ff0055' }
                });
                boundaryBodies.push(wall);
            }
            Composite.add(engine.world, boundaryBodies);
        }

        createArena();

        // Sample Country Flags/Balls Setup
        let flagBodies = [];
        let totalFlags = 20;
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#00d2d3'];

        function spawnFlags(count) {
            // Remove existing flags
            flagBodies.forEach(f => Composite.remove(engine.world, f));
            flagBodies = [];

            for (let i = 0; i < count; i++) {
                const offsetX = centerX + (Math.random() - 0.5) * 100;
                const offsetY = centerY + (Math.random() - 0.5) * 100;
                const flag = Bodies.circle(offsetX, offsetY, 18, {
                    restitution: 0.8,
                    friction: 0.005,
                    render: {
                        fillStyle: colors[i % colors.length]
                    }
                });
                flagBodies.push(flag);
            }
            Composite.add(engine.world, flagBodies);
        }

        spawnFlags(totalFlags);

        // Game Loop for Rotating Boundaries and Checking Winners
        Events.on(engine, 'beforeUpdate', () => {
            rotatingAngle += rotationSpeed;
            // You can add rotation logic or arena effects here
            
            // Check if flags fall out of the circle bounds
            flagBodies.forEach((flag, index) => {
                const dist = Math.hypot(flag.position.x - centerX, flag.position.y - centerY);
                if (dist > circleRadius + 50) {
                    // Flag eliminated
                    Composite.remove(engine.world, flag);
                    flagBodies.splice(index, 1);
                    
                    if (flagBodies.length === 1) {
                        document.getElementById('top-banner').innerText = "Winner: Champion! 🏆";
                        setTimeout(() => {
                            spawnFlags(totalFlags);
                            document.getElementById('top-banner').innerText = "Country Battle Arena";
                        }, 4000);
                    }
                }
            });
        });

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function updateSettings() {
            rotationSpeed = parseFloat(document.getElementById('speed-select').value);
            totalFlags = parseInt(document.getElementById('flags-select').value);
            spawnFlags(totalFlags);
        }
    </script>
</body>
</html>
